<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercoff.css">
    <title>Bombas Hidráulicas</title>
</head>
<body>
    <header class="topo">
        <div class="nav-row">
            <img src="Windows.png" alt="Logo" class="logo">
            <nav>
                <a href="home.html">Home</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <section class="hero" id="home">
        <h1>Bombas Hidráulicas</h1>
        <p>Trabalhamos com o que há de mais moderno em sistemas do bombeamento de água.</p>
    </section>

   <div class="conteudo2">
    <main class="card2">
        <h2>Fale Conosco</h2>
        <form class="contact-form">
            <label for="name">Nome:</label>
            <input type="text" id="name" placeholder="Seu Nome">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Seu Email">
            <br>
            <label for="message">Mensagem:</label>
            <textarea id="message" placeholder="Como podemos ajudar?"></textarea>
            <br>
            <button type="submit" class="btn">Enviar</button> 
        </form>
    </main>
    </div>

    <footer class="rodape">
        <div class="redes">
            <img src="Facebook_logo_(square).png" alt="Facebook">
            <img src="Instagram_icon.png" alt="Instagram">
            <img src="Youtube_logo.png" alt="Youtube">
        </div>
        <p>© <span id="year"></span> Hidráulica Pro Brasil - Todos os direitos reservados.</p>
    </footer>

    <script src="./exercoff.js"></script>
</body>
</html>
